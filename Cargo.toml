[package]
name = "anonymous-credit-tokens"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "An implementation of Anonymous Credit Tokens, an online variant of e-cash"
license = "Apache-2.0"
repository = "https://github.com/SamuelSchlesinger/anonymous-credit-tokens"
keywords = ["cryptography", "e-cash", "anonymous-creds", "privacy", "zero-knowledge"]
categories = ["cryptography"]
exclude = ["draft-act/", ".github/", "docs/", "proptest.toml"]

[dependencies]
ciborium = "0.2"
blake3 = "1.8.1"
curve25519-dalek = { version = "4.1.3", features = ["group", "ff", "digest", "zeroize", "precomputed-tables"] }
group = "0.13.0"
rand_core = "0.6.4"
subtle = "2.6.1"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }

[dev-dependencies]
proptest = "1.6.0"
rand = "0.8.5"
rand_chacha = "0.3.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
criterion = "0.5.1"

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1

[[bench]]
name = "benchmark"
harness = false
