[package]
name = "anonymous-credit-tokens"
version = "0.2.1"
edition = "2024"
description = "An implementation of Anonymous Credit Tokens, an online variant of e-cash"
license-file = "LICENSE"
repository = "https://github.com/SamuelSchlesinger/anonymous-credit-tokens"

[dependencies]
sha2 = "0.10"
curve25519-dalek = { version = "4.1.3", features = ["group", "ff", "digest", "zeroize", "precomputed-tables"] }
group = "0.13.0"
rand_core = "0.6.4"
# Fork of sigma-proofs 0.3.2 adding into_nizk_with_protocol_id, so ACT can set
# the unique Fiat-Shamir protocol identifier its specification mandates
# (draft-irtf-cfrg-sigma-protocols Section 5). Track upstream for the override.
sigma-proofs = { git = "https://github.com/SamuelSchlesinger/sigma-proofs.git", branch = "act-protocol-id" }
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }

[dev-dependencies]
rand = "0.8.5"
rand_core = { version = "0.6.4", features = ["getrandom"] }
criterion = "0.5.1"
proptest = "1.6.0"

[[bench]]
name = "benchmark"
harness = false
