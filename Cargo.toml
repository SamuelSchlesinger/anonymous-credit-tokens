[package]
name = "anonymous-credit-tokens"
version = "0.5.0"
edition = "2024"
description = "An implementation of Anonymous Credit Tokens, an online variant of e-cash"
license-file = "LICENSE"
repository = "https://github.com/SamuelSchlesinger/anonymous-credit-tokens"

[dependencies]
sha2 = "0.10"
curve25519-dalek = { version = "4.1.3", features = ["group", "ff", "digest", "zeroize", "precomputed-tables"] }
group = "0.13.0"
rand_core = "0.6.4"
sigma-proofs = { path = "sigma-proofs" }
subtle = "2.6.1"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
hex = "0.4"

[dev-dependencies]
rand = "0.8.5"
rand_core = { version = "0.6.4", features = ["getrandom"] }
criterion = "0.5.1"
proptest = "1.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1

[[bench]]
name = "benchmark"
harness = false
