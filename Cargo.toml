[package]
name = "anonymous-credit-tokens"
version = "0.4.2"
edition = "2024"
rust-version = "1.85"
description = "An implementation of Anonymous Credit Tokens, an online variant of e-cash"
license = "Apache-2.0"
repository = "https://github.com/SamuelSchlesinger/anonymous-credit-tokens"
keywords = ["cryptography", "e-cash", "anonymous-creds", "privacy", "zero-knowledge"]
categories = ["cryptography"]
exclude = ["draft-act/", ".github/", "docs/", "proptest.toml"]

[features]
default = ["p256"]
p256 = ["dep:p256-crate", "dep:elliptic-curve", "dep:sha2"]
ristretto255 = ["dep:curve25519-dalek"]
secp256k1 = ["dep:k256-crate", "dep:elliptic-curve", "dep:sha2"]

[dependencies]
ciborium = "0.2"
blake3 = "1.8.1"
p256-crate = { package = "p256", version = "0.13", features = ["arithmetic", "hash2curve"], optional = true }
k256-crate = { package = "k256", version = "0.13", features = ["arithmetic", "hash2curve"], optional = true }
elliptic-curve = { version = "0.13", features = ["hash2curve"], optional = true }
sha2 = { version = "0.10", optional = true }
curve25519-dalek = { version = "4.1.3", features = ["group", "ff", "digest", "zeroize", "precomputed-tables"], optional = true }
group = "0.13.0"
rand_core = "0.6.4"
subtle = "2.6.1"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }

[dev-dependencies]
proptest = "1.6.0"
rand = "0.8.5"
rand_chacha = "0.3.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
criterion = "0.5.1"

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1

[[bench]]
name = "benchmark_p256"
harness = false
required-features = ["p256"]

[[bench]]
name = "fast_p256"
harness = false
required-features = ["p256"]

[[bench]]
name = "benchmark_ristretto255"
harness = false
required-features = ["ristretto255"]

[[bench]]
name = "fast_ristretto255"
harness = false
required-features = ["ristretto255"]

[[bench]]
name = "benchmark_secp256k1"
harness = false
required-features = ["secp256k1"]

[[bench]]
name = "fast_secp256k1"
harness = false
required-features = ["secp256k1"]

[[test]]
name = "generate_test_vectors"
required-features = ["p256"]

[[test]]
name = "generate_test_vectors_ristretto255"
required-features = ["ristretto255"]
