[package]
name = "anonymous-credit-tokens-public"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Publicly verifiable Anonymous Credit Tokens using BLS12-381 pairings"
license = "Apache-2.0"
keywords = ["cryptography", "e-cash", "anonymous-creds", "privacy", "zero-knowledge"]
categories = ["cryptography"]

[dependencies]
bls12_381 = { version = "0.8", features = ["pairings"] }
pairing = "0.23"
group = "0.13"
ff = "0.13"
blake3 = "1.8"
subtle = "2.6"
rand_core = "0.6"
ciborium = "0.2"

[dev-dependencies]
proptest = "1.6.0"
rand = "0.8.5"
rand_chacha = "0.3.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
criterion = "0.5.1"

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "fast"
harness = false
